stages:
- build
- test
- test-report-aggregate
- deploy
- publish
- cleanup

variables:
  # Variables required by Common CI jobs
  CI_COMMON_JOB_VERSION: "944641b872e1a1e0f184c435233c125acb285957"
  DOCKER_BUILDER_TAG: "$CI_COMMON_JOB_VERSION"
  DOCKER_DIND_TAG: "$CI_COMMON_JOB_VERSION"
  IMAGE_REMOVER_TAG: "$CI_COMMON_JOB_VERSION"
  # Git configuration
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
- project: "hive/common-ci-configuration"
  ref: develop
  file: "/templates/docker_image_jobs.gitlab-ci.yml"

default:
  hooks:
    pre_get_sources_script:
      # Clean corrupt git state left by cancelled pipelines (see GitLab #296638, #4600)
      # Wrapped in subshell to avoid changing working directory for subsequent git operations
      - |
        (
        cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
        echo "pre_get_sources: checking $(pwd) for corrupt git state"
        if [ -d ".git" ]; then
          # Remove stale lock files that block git operations
          find .git -name "*.lock" -delete 2>/dev/null || true

          # Check if main repo is corrupt - if so, remove .git to force fresh clone
          if ! git rev-parse HEAD >/dev/null 2>&1; then
            echo "pre_get_sources: main repository corrupt, forcing fresh clone"
            rm -rf .git
          else
            # Main repo OK - check and clean corrupt submodules
            # Check both the working dir and .git/modules/ since either can be corrupt
            if [ -f ".gitmodules" ]; then
              git config --file .gitmodules --get-regexp path 2>/dev/null | awk '{print $2}' | while read submod; do
                needs_clean=false
                [ -z "$submod" ] && continue
                # Check if submodule working directory exists but is corrupt
                if [ -d "$submod" ] && [ -f "$submod/.git" ]; then
                  if ! git -C "$submod" rev-parse HEAD >/dev/null 2>&1; then
                    needs_clean=true
                  fi
                fi
                # Check if .git/modules exists but is corrupt (even if working dir is gone)
                if [ -d ".git/modules/$submod" ]; then
                  if ! git --git-dir=".git/modules/$submod" rev-parse HEAD >/dev/null 2>&1; then
                    echo "pre_get_sources: $submod corrupt (rev-parse failed)"
                    needs_clean=true
                  fi
                fi
                if [ "$needs_clean" = true ]; then
                  echo "pre_get_sources: cleaning corrupt submodule: $submod"
                  rm -rf "$submod" ".git/modules/$submod"
                fi
              done
            fi
            echo "pre_get_sources: existing repo OK"
          fi
        else
          echo "pre_get_sources: no .git directory (fresh workspace)"
        fi
        )

docker-build:
  extends: .docker_image_builder_job_template
  stage: build
  rules:
    # Run for all branches
  - if: '$CI_COMMIT_BRANCH'
    # Run for all tags
  - if: '$CI_COMMIT_TAG'
  before_script:
    - !reference [.docker_image_builder_job_template, before_script]
    - |
      echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
      echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):tag[collapsed=true]\r\e[0KDetermining tag for the new image..."
    # Always tag with short SHA
    export TAGS="$CI_COMMIT_SHORT_SHA"

    # Add branch-specific tags
    if [[ -n "$CI_COMMIT_TAG" ]]; then
      echo "Running on tag '$CI_COMMIT_TAG': adding tag $CI_COMMIT_TAG"
      export TAGS="$TAGS $CI_COMMIT_TAG"
      export TAG="$CI_COMMIT_TAG"
    elif [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
      echo "Running on default branch '$CI_DEFAULT_BRANCH': adding tag 'latest'"
      export TAGS="$TAGS latest"
      export TAG="latest"
    elif [[ "$CI_COMMIT_BRANCH" == "develop" ]]; then
      echo "Running on develop branch: adding tag 'develop'"
      export TAGS="$TAGS develop"
      export TAG="develop"
    else
      echo "Running on branch '$CI_COMMIT_BRANCH': adding tag $CI_COMMIT_REF_SLUG"
      export TAGS="$TAGS $CI_COMMIT_REF_SLUG"
      export TAG="$CI_COMMIT_REF_SLUG"
    fi

    echo "Tags to be applied: $TAGS"
    echo -e "\e[0Ksection_end:$(date +%s):tag\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):build[collapsed=true]\r\e[0KBaking root image..."
    git config --global --add safe.directory "$CI_PROJECT_DIR"
    scripts/build_instance.sh --progress=plain "$CI_PROJECT_DIR"

    # Pull the image locally since buildx pushes directly to registry
    docker pull "$CI_REGISTRY_IMAGE:$TAG"

    # Apply all tags for GitLab registry
    for TAG_NAME in $TAGS; do
      if [[ "$TAG_NAME" != "$TAG" ]]; then
        docker tag "$CI_REGISTRY_IMAGE:$TAG" "$CI_REGISTRY_IMAGE:$TAG_NAME"
      fi
    done

    # Push all tags to GitLab registry
    for TAG_NAME in $TAGS; do
      docker push "$CI_REGISTRY_IMAGE:$TAG_NAME"
    done

    echo "IMAGE_NAME=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" > docker-build.env
    echo "Unique image tag:"
    cat docker-build.env
    echo -e "\e[0Ksection_end:$(date +%s):build\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):build-explorer[collapsed=true]\r\e[0KBaking explorer subdirectory variant..."
    # Save original registry image for second build
    ORIGINAL_CI_REGISTRY_IMAGE="$CI_REGISTRY_IMAGE"
    export CI_REGISTRY_IMAGE="$CI_REGISTRY_IMAGE/explorer-subdirectory"

    scripts/build_instance.sh --progress=plain --base-path="/explorer" "$CI_PROJECT_DIR"

    # Pull and tag the explorer variant
    docker pull "$CI_REGISTRY_IMAGE:$TAG"

    # Apply all tags for explorer variant
    for TAG_NAME in $TAGS; do
      if [[ "$TAG_NAME" != "$TAG" ]]; then
        docker tag "$CI_REGISTRY_IMAGE:$TAG" "$CI_REGISTRY_IMAGE:$TAG_NAME"
      fi
    done

    # Push all tags for explorer variant to GitLab registry
    for TAG_NAME in $TAGS; do
      docker push "$CI_REGISTRY_IMAGE:$TAG_NAME"
    done

    echo "EXPLORER_SUBDIRECTORY_IMAGE_NAME=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" >> docker-build.env
    echo "Explorer variant tag:"
    echo "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    echo -e "\e[0Ksection_end:$(date +%s):build-explorer\r\e[0K"
  artifacts:
    reports:
      dotenv: docker-build.env
  tags:
  - public-runner-docker

.node-job:
  extends: .job-defaults
  image:
    name: node:18.20-alpine3.20
    entrypoint: []
  stage: test
  script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):deps[collapsed=true]\r\e[0KInstalling dependencies..."
    npm ci --cache .npm
    echo -e "\e[0Ksection_end:$(date +%s):deps\r\e[0K"
  cache:
    key: block-explorer-ui-cache-1
    paths:
    - .npm/
    - .next/
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    when: always
    expire_in: 1 week
  tags:
  - public-runner-docker

lint:
  extends: .node-job
  script:
  - !reference [.node-job, script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):lint[collapsed=true]\r\e[0KRunning linter..."
    npm run lint 2>&1 | tee npm-lint.log
    echo -e "\e[0Ksection_end:$(date +%s):lint\r\e[0K"
  artifacts:
    paths:
    - "npm-lint.log"

startup-test:
  extends: .docker_image_builder_job_template
  stage: test
  needs:
  - docker-build
  variables:
    PORT: 5000
    API_ENDPOINT: http://192.168.4.250:3000/rpc
    HIVE_BLOG_API_ENDPOINT: https://api.hive.blog
    CONTAINER_NAME: block-explorer-ui
    MESSAGE: Waiting for container startup...
  before_script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):startup[collapsed=true]\r\e[0KStarting the test environment..."

    timeout -s INT -k 10 600 scripts/run_instance.sh \
      --image="$IMAGE_NAME" \
      --api-endpoint="$API_ENDPOINT" \
      --hive-blog-api-endpoint="$HIVE_BLOG_API_ENDPOINT" \
      --port="$PORT" \
      --name="$CONTAINER_NAME" \
      --detach

    echo -e "\e[0Ksection_end:$(date +%s):startup\r\e[0K"
    echo -e "\e[0Ksection_start:$(date +%s):wait[collapsed=true]\r\e[0K$MESSAGE"

    until [[ "healthy" == "$(docker inspect -f '{{ .State.Health.Status }}' "$CONTAINER_NAME")" ]]
    do
      echo "$MESSAGE"
      sleep 3
    done

    echo -e "\e[0Ksection_end:$(date +%s):wait\r\e[0K"
  after_script:
  - |
    docker logs --timestamps "$CONTAINER_NAME" > "$CONTAINER_NAME.log"
    docker stop "$CONTAINER_NAME"
  artifacts:
    paths:
    - "$CONTAINER_NAME.log"
  tags:
  - public-runner-docker

.e2e_tests_template:
  extends: .node-job
  image: mcr.microsoft.com/playwright:v1.47.0-jammy
  parallel:
    matrix:
    - PROJECT: ["chromium", "firefox", "webkit"]
      SHARD_INDEX: [1, 2, 3, 4, 5]
      SHARD_TOTAL: 5
  script:
  - !reference [.node-job, script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):tests[collapsed=false]\r\e[0KRunning tests..."
    cd ./
    npx playwright test --project=$PROJECT --shard=$SHARD_INDEX/$SHARD_TOTAL --update-snapshots
    echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"
  artifacts:
    paths:
    - ./playwright-report/
    - ./test-results/
    - ./junit/
    reports:
      junit: ./junit/**/**/results.xml

e2e-tests:
  extends: .e2e_tests_template
  needs:
  - docker-build
  services:
  - name: $IMAGE_NAME
    alias: block-explorer
    variables:
      REACT_APP_API_ADDRESS: https://api.hive.blog
      REACT_APP_HIVE_BLOG_API_ADDRESS: https://api.hive.blog
  variables:
    PORT: 5000
    BLOCK_EXPLORER_URL: http://block-explorer:$PORT

.e2e_report_aggregate_template:
  extends: .node-job
  stage: test-report-aggregate
  when: always
  image: mcr.microsoft.com/playwright:v1.47.0-jammy
  script:
  - cd ./
  - npm install playwright-merge-html-reports --dev
  - npx playwright test tests/playwright/merge-reports/ --config playwright.merge.config.ts
  artifacts:
    paths:
    - ./merged-html-report/
    - ./junit/

e2e-report-aggregate:
  extends: .e2e_report_aggregate_template
  needs:
  - e2e-tests
  variables:
    PROJECTS: '["chromium", "firefox", "webkit"]'
    SHARD_TOTAL: 5
    PORT: 5000
    BLOCK_EXPLORER_URL: http://block-explorer:$PORT

.deploy:
  extends: .job-defaults
  stage: deploy
  needs:
  - docker-build
  - startup-test
  before_script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    scripts/run_instance.sh \
      --image="$IMAGE_NAME" \
      --api-endpoint="$API_ENDPOINT" \
      --hive-blog-api-endpoint="$HIVE_BLOG_API_ENDPOINT" \
      --port="$PORT" \
      --name="$CONTAINER_NAME" \
      --detach
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
    allow_failure: true
  tags:
  - hs-bexplorer

staging:deploy:
  extends: .deploy
  variables:
    PORT: 5000
    API_ENDPOINT: https://api.hive.blog
    HIVE_BLOG_API_ENDPOINT: https://api.hive.blog
    CONTAINER_NAME: block-explorer-ui
  environment:
    name: staging
    action: start
    on_stop: staging:stop
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
    when: manual
    allow_failure: true

test:deploy:
  extends: .deploy
  variables:
    PORT: 5001
    API_ENDPOINT: https://api.hive.blog
    HIVE_BLOG_API_ENDPOINT: https://api.hive.blog
    CONTAINER_NAME: block-explorer-ui-2
  environment:
    name: test
    action: start
    on_stop: test:stop

.stop:
  extends: .job-defaults
  stage: deploy
  variables:
    GIT_STRATEGY: none
  script:
  - docker ps -q --filter "name=$CONTAINER_NAME" | grep -q . && docker stop $CONTAINER_NAME
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
    allow_failure: true
  tags:
  - hs-bexplorer

staging:stop:
  extends: .stop
  needs:
  - staging:deploy
  variables:
    CONTAINER_NAME: block-explorer-ui
    GIT_STRATEGY: none
  environment:
    name: staging
    action: stop
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
    when: manual
    allow_failure: true

test:stop:
  extends: .stop
  needs:
  - test:deploy
  variables:
    CONTAINER_NAME: block-explorer-ui-2
    GIT_STRATEGY: none
  environment:
    name: test
    action: stop

# Publish to registry.hive.blog - pull/retag/push only, no rebuild
publish_images:
  extends: .docker_publish_job_template
  stage: publish
  variables:
    # Publish both root image and explorer-subdirectory variant to hive.blog
    # "block_explorer_ui" matches CI_PROJECT_NAME -> publishes root image
    PUBLISH_IMAGES: "block_explorer_ui explorer-subdirectory"
  tags:
    - public-runner-docker

buildkit_cache_cleanup:
  stage: cleanup
  extends: .buildkit_cleanup_job_template
  needs: []
  variables:
    CACHE_REPOSITORIES: "cache"
